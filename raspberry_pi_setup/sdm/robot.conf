# MiAM image settings. Committed to Git; credentials belong in secrets.conf.
# Bash syntax: keep values quoted.

# Account
ROBOT_HOSTNAME="miam-robot"
ROBOT_USER="pi"

# Localization
WIFI_COUNTRY="FR"
TIMEZONE="Europe/Paris"
LOCALE="en_GB.UTF-8"
KEYMAP="fr"

# Wi-Fi hotspot
HOTSPOT_ADDRESS="192.168.6.2/24"
HOTSPOT_DHCP_START="192.168.6.3"
HOTSPOT_DHCP_END="192.168.6.20"
HOTSPOT_CHANNEL="6"                 # 2.4 GHz: 1, 6 or 11

# Display
SCREEN_OUTPUT="DSI-1"               # Output name from xrandr; '' skips rotation
SCREEN_ROTATION="inverted"          # normal, inverted, left, right

